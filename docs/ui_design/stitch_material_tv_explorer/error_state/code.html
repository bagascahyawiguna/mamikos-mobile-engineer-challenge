<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface dark:bg-surface text-on-surface dark:text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface dark:bg-surface shadow-sm docked full-width top-0 bg-surface-container-low dark:bg-surface-container-low">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="movie_filter">movie_filter</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed-dim">ShowCase</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Canvas (Error State) -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter pt-24 pb-24 relative overflow-hidden">
<!-- Decorative Background Element -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined" style="font-size: 300px; color: var(--color-on-surface-variant);">wifi_off</span>
</div>
<div class="z-10 flex flex-col items-center text-center max-w-md w-full">
<div class="w-24 h-24 mb-6 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="cloud_off" style="font-size: 48px;">cloud_off</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-component-gap-sm">Unable to load TV Shows</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 px-4">
                We're having trouble reaching the server. Please check your internet connection and try again to continue browsing your favorite shows.
            </p>
<!-- Retry Button -->
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-8 py-4 rounded-full flex items-center gap-2 hover:bg-primary/90 active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                Retry Connection
            </button>
<a class="mt-6 text-primary dark:text-primary-fixed-dim font-label-sm text-label-sm hover:underline" href="#">Go to Downloads</a>
</div>
</main>
<!-- BottomNavBar -->
<!-- Desktop SideNav (Hidden on Mobile) - Kept simple as per instructions for layout anchor -->
<aside class="hidden md:flex flex-col fixed left-0 top-16 bottom-0 w-20 bg-surface-container-low items-center py-8 gap-8 border-r border-surface-variant z-40">
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full p-3 w-14 h-14 hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined fill" data-icon="home" data-weight="fill">home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-3 w-14 h-14 hover:bg-surface-container-highest transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-3 w-14 h-14 hover:bg-surface-container-highest transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="bookmarks">bookmarks</span>
</button>
</aside>
