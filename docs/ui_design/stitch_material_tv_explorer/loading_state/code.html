<style>
        .skeleton-shimmer {
            background: linear-gradient(to right, 
                theme('colors.surface-container-high') 0%, 
                theme('colors.surface-container-highest') 50%, 
                theme('colors.surface-container-high') 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% {
                background-position: -100% 0;
            }
            100% {
                background-position: 100% 0;
            }
        }
        
        body {
            /* Prevent scrolling during loading */
            overflow: hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md text-body-md antialiased md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface shadow-sm md:hidden">
<button class="text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">movie_filter</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">ShowCase</h1>
<button class="text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</button>
</header>
<!-- Desktop Top Nav (Hybrid of TopAppBar and BottomNavBar labels) -->
<header class="hidden md:flex fixed top-0 left-0 w-full z-50 justify-between items-center px-margin-desktop h-16 bg-surface shadow-sm">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">movie_filter</span>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">ShowCase</h1>
</div>
<nav class="flex items-center gap-8">
<a class="flex items-center gap-2 text-primary font-label-lg text-label-lg relative after:absolute after:bottom-[-4px] after:left-0 after:w-full after:h-1 after:bg-primary after:rounded-t-full" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
                Home
            </a>
<a class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-lg text-label-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">explore</span>
                Browse
            </a>
<a class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-lg text-label-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">bookmarks</span>
                Watchlist
            </a>
</nav>
<button class="text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</button>
</header>
<!-- Main Content Area - Skeleton Loading State -->
<main class="pt-20 md:pt-24 px-margin-mobile md:px-margin-desktop max-w-[840px] mx-auto w-full flex flex-col gap-component-md pb-8">
<!-- Grid Skeleton -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-component-md">
<!-- Card 1 -->
<div class="flex flex-col gap-component-sm">
<div class="w-full aspect-[2/3] rounded-lg skeleton-shimmer"></div>
<div class="w-3/4 h-4 rounded skeleton-shimmer"></div>
<div class="w-1/2 h-3 rounded skeleton-shimmer"></div>
</div>

</div>
<!-- Card 3 -->

</div>

</div>
</div>
